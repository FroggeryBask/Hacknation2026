[project]
name = "autoformularz"
version = "0.1.0"
description = "AI form digitization: paper form file -> e-form JSON configuration (COI import format)"
requires-python = ">=3.14"
license = "MIT"
# Every dependency must be open source and NOT copyleft (task requirement): MIT / BSD / Apache-2.0 only.
dependencies = [
    "fastapi>=0.120",            # MIT
    "uvicorn>=0.38",             # BSD-3
    "python-multipart>=0.0.20",  # Apache-2.0
    "pydantic>=2.12",            # MIT
    "pydantic-settings>=2.11",   # MIT
    "pyjwt>=2.10",               # MIT
    "httpx>=0.28",               # BSD-3
    "python-docx>=1.2",          # MIT
    "openpyxl>=3.1",             # MIT
    "pypdf>=6.0",                # BSD-3
    "pypdfium2>=4.30",           # Apache-2.0 / BSD-3 (render scanned PDF pages for the vision model)
    "pillow>=11.3",              # MIT-CMU (HPND): downscale images before sending them to the model
]

[dependency-groups]
dev = ["pytest>=8.4", "ruff>=0.14"]

[project.scripts]
autoformularz = "autoformularz.main:run"
autoformularz-token = "autoformularz.devtoken:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autoformularz"]

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # ruff format wraps code; long prose (prompt, messages) is fine

[tool.pytest.ini_options]
testpaths = ["tests"]
