# Whole solution: API + frontend, the model on Eden AI (default, team decision 2026-11-21).
#   cp .env.example .env   # set AUTOFORMULARZ_JWT_SECRET and EDENAI_API_KEY
#   docker compose up --build
# Offline, local model instead (Ollama + qwen3-vl:8b, ~6 GB download):
#   AUTOFORMULARZ_LLM_PROVIDER=ollama docker compose --profile ollama up --build
# GPU (NVIDIA): uncomment the `deploy` block under `ollama`.

services:
  ollama:
    image: ollama/ollama:0.40.17
    profiles: ["ollama"]
    volumes:
      - ollama:/root/.ollama
    # Ready = the server answers; the model download waits for this instead of guessing with sleep.
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

  # One-shot: downloads the model into the shared volume, then exits.
  model:
    image: ollama/ollama:0.40.17
    profiles: ["ollama"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${AUTOFORMULARZ_LLM_MODEL:-qwen3-vl:8b}"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  api:
    build: ./api
    image: autoformularz-api:0.1.0  # explicit version instead of the default `latest` tag
    env_file: .env
    environment:
      AUTOFORMULARZ_LLM_PROVIDER: ${AUTOFORMULARZ_LLM_PROVIDER:-eden}
      AUTOFORMULARZ_EDEN_MODEL: ${AUTOFORMULARZ_EDEN_MODEL:-deepinfra/Qwen/Qwen3-VL-30B-A3B-Instruct}
      AUTOFORMULARZ_OLLAMA_URL: http://ollama:11434
      # The key reaches only the API (from .env at runtime), never the image or the frontend.
      EDENAI_API_KEY: ${EDENAI_API_KEY:-}
    ports:
      - "8000:8000"
    # With the ollama profile: starts once the model is in the volume (no "model not found" on the first
    # request). Without it (Eden) these services do not exist and the API starts at once.
    depends_on:
      ollama:
        condition: service_healthy
        required: false
      model:
        condition: service_completed_successfully
        required: false

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: autoformularz-web:0.1.0
    env_file: .env
    environment:
      AUTOFORMULARZ_API_URL: http://api:8000
      EDENAI_API_KEY: ""
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  ollama:
