# Whole solution offline: local model (Ollama) + API + frontend.
#   cp .env.example .env   # set AUTOFORMULARZ_JWT_SECRET
#   docker compose up --build
# GPU (NVIDIA): uncomment the `deploy` block under `ollama`.

services:
  ollama:
    image: ollama/ollama:0.40.17
    volumes:
      - ollama:/root/.ollama
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

  # One-shot: downloads the model into the shared volume, then exits.
  model:
    image: ollama/ollama:0.40.17
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c", "sleep 3 && ollama pull ${AUTOFORMULARZ_LLM_MODEL:-qwen3-vl:8b}"]
    depends_on:
      - ollama
    restart: "no"

  api:
    build: ./api
    env_file: .env
    environment:
      AUTOFORMULARZ_OLLAMA_URL: http://ollama:11434
      # Delivered solution always uses the local model; Eden AI is for local development only.
      AUTOFORMULARZ_LLM_PROVIDER: ollama
      EDENAI_API_KEY: ""
    ports:
      - "8000:8000"
    depends_on:
      - ollama

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    env_file: .env
    environment:
      AUTOFORMULARZ_API_URL: http://api:8000
      EDENAI_API_KEY: ""
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  ollama:
