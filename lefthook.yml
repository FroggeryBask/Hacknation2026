# Git hooks. Installed automatically by `npm install` (prepare script).
pre-commit:
  parallel: true
  commands:
    biome:
      glob: "*.{js,ts,jsx,tsx,json,jsonc,css}"
      run: npx biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    ruff-scripts:
      glob: "scripts/**/*.py"
      run: uv run --project scripts ruff check --fix {staged_files} && uv run --project scripts ruff format {staged_files}
      stage_fixed: true
    ruff-api:
      glob: "api/**/*.py"
      run: uv run --project api ruff check --fix {staged_files} && uv run --project api ruff format {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    no-ai-attribution:
      run: sh scripts/commit-msg.sh {1}

pre-push:
  commands:
    check:
      run: npm run check
