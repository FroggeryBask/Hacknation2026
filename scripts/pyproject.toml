[project]
name = "hackaton-scripts"
version = "0.1.0"
description = "Repo checks (lint, tests, smoke) for the formgen project"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
]

[dependency-groups]
dev = ["ruff>=0.8"]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
